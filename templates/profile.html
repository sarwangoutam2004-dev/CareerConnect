
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile - CareerConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">


<!-- Navbar -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{% url 'dashboard' %}"
        >
            CareerConnect
        </a>

        <div>

            <a
                href="{% url 'job_list' %}"
                class="btn btn-outline-light me-2"
            >
                Browse Jobs
            </a>

            <a
                href="{% url 'my_applications' %}"
                class="btn btn-outline-light me-2"
            >
                My Applications
            </a>

            <a
                href="{% url 'logout' %}"
                class="btn btn-danger"
            >
                Logout
            </a>

        </div>

    </div>

</nav>


<!-- Main -->

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-5">

                    <h1 class="fw-bold mb-2">
                        My Profile
                    </h1>

                    <p class="text-muted mb-4">
                        Update your personal and academic information.
                    </p>


                    <form
                        method="POST"
                        enctype="multipart/form-data"
                    >

                        {% csrf_token %}


                        <!-- Phone -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Phone Number
                            </label>

                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                                value="{{ profile.phone }}"
                                placeholder="Enter your phone number"
                            >

                        </div>


                        <!-- College -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                College
                            </label>

                            <input
                                type="text"
                                name="college"
                                class="form-control"
                                value="{{ profile.college }}"
                                placeholder="Enter your college name"
                            >

                        </div>


                        <!-- Degree -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Degree
                            </label>

                            <input
                                type="text"
                                name="degree"
                                class="form-control"
                                value="{{ profile.degree }}"
                                placeholder="e.g. B.Tech Computer Science"
                            >

                        </div>


                        <!-- Skills -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Skills
                            </label>

                            <textarea
                                name="skills"
                                class="form-control"
                                rows="4"
                                placeholder="Python, Django, Java, SQL..."
                            >{{ profile.skills }}</textarea>

                        </div>


                        <!-- Resume -->

                       
<!-- Resume -->

<div class="mb-4">

    <label class="form-label fw-bold">
        Resume
    </label>

    <input
        type="file"
        name="resume"
        class="form-control"
    >

    {% if profile.resume %}

        <div class="mt-3">

            <p class="text-success mb-2">
                ✓ Resume uploaded
            </p>

            <div class="d-flex gap-2">

                <a
                    href="{{ profile.resume.url }}"
                    target="_blank"
                    class="btn btn-outline-primary"
                >
                    📄 View Resume
                </a>

                <button
                    type="submit"
                    name="delete_resume"
                    value="yes"
                    class="btn btn-outline-danger"
                    onclick="return confirm('Are you sure you want to delete your resume?');"
                >
                    🗑️ Delete Resume
                </button>

            </div>

            <p class="text-muted small mt-2">
                Select a new file above to replace your current resume.
            </p>

        </div>

    {% else %}

        <p class="text-muted small mt-2 mb-0">
            No resume uploaded yet.
        </p>

    {% endif %}

</div>




                        <!-- Buttons -->

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Profile
                        </button>

                        <a
                            href="{% url 'dashboard' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Job - CareerConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="/"
        >
            CareerConnect
        </a>

        <a
            href="{% url 'recruiter_dashboard' %}"
            class="btn btn-outline-light"
        >
            Dashboard
        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-5">

                    <h1 class="fw-bold mb-4">
                        Edit Job
                    </h1>


                    <form method="POST">

                        {% csrf_token %}


                        <!-- Job Title -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Job Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                value="{{ job.title }}"
                                required
                            >

                        </div>


                        <!-- Description -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="5"
                                required
                            >{{ job.description }}</textarea>

                        </div>


                        <!-- Location + Salary -->

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-bold">
                                    Location
                                </label>

                                <input
                                    type="text"
                                    name="location"
                                    class="form-control"
                                    value="{{ job.location }}"
                                    required
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-bold">
                                    Salary
                                </label>

                                <input
                                    type="text"
                                    name="salary"
                                    class="form-control"
                                    value="{{ job.salary }}"
                                >

                            </div>

                        </div>


                        <!-- Job Type -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Job Type
                            </label>

                            <select
                                name="job_type"
                                class="form-select"
                                required
                            >

                                <option value="Internship"
                                    {% if job.job_type == "Internship" %}selected{% endif %}>
                                    Internship
                                </option>

                                <option value="Full Time"
                                    {% if job.job_type == "Full Time" %}selected{% endif %}>
                                    Full Time
                                </option>

                                <option value="Part Time"
                                    {% if job.job_type == "Part Time" %}selected{% endif %}>
                                    Part Time
                                </option>

                            </select>

                        </div>


                        <!-- Required Skills -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Required Skills
                            </label>

                            <input
                                type="text"
                                name="skills"
                                class="form-control"
                                value="{{ job.skills }}"
                            >

                        </div>


                        <!-- Application Deadline -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Application Deadline
                            </label>

                            <input
                                type="date"
                                name="deadline"
                                class="form-control"
                                value="{{ job.deadline|date:'Y-m-d' }}"
                                required
                            >

                            <div class="form-text">
                                Students will not be able to apply after this date.
                            </div>

                        </div>


                        <!-- Buttons -->

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Changes
                        </button>

                        <a
                            href="{% url 'recruiter_dashboard' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>

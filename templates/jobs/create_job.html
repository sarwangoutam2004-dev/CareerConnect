<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Post New Job - CareerConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="/"
        >
            CareerConnect
        </a>

        <a
            href="{% url 'recruiter_dashboard' %}"
            class="btn btn-outline-light"
        >
            Dashboard
        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-5">

                    <h1 class="fw-bold mb-2">
                        Post New Job
                    </h1>

                    <p class="text-muted mb-4">
                        Add a new job opening for students.
                    </p>


                    {% if error %}

                    <div class="alert alert-danger">
                        {{ error }}
                    </div>

                    {% endif %}


                    <form method="POST">

                        {% csrf_token %}


                        <!-- Job Title -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Job Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                placeholder="e.g. Python Developer"
                                required
                            >

                        </div>


                        <!-- Description -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="5"
                                placeholder="Describe the job..."
                                required
                            ></textarea>

                        </div>


                        <!-- Location + Salary -->

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-bold">
                                    Location
                                </label>

                                <input
                                    type="text"
                                    name="location"
                                    class="form-control"
                                    placeholder="e.g. Delhi"
                                    required
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-bold">
                                    Salary
                                </label>

                                <input
                                    type="text"
                                    name="salary"
                                    class="form-control"
                                    placeholder="e.g. ₹5 LPA"
                                >

                            </div>

                        </div>


                        <!-- Job Type -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Job Type
                            </label>

                            <select
                                name="job_type"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Job Type
                                </option>

                                <option value="Internship">
                                    Internship
                                </option>

                                <option value="Full Time">
                                    Full Time
                                </option>

                                <option value="Part Time">
                                    Part Time
                                </option>

                            </select>

                        </div>


                        <!-- Required Skills -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Required Skills
                            </label>

                            <input
                                type="text"
                                name="skills"
                                class="form-control"
                                placeholder="Python, Django, SQL, Git"
                                spellcheck="false"
                            >

                        </div>


                        <!-- Application Deadline -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Application Deadline
                            </label>

                            <input
                                type="date"
                                name="deadline"
                                class="form-control"
                                required
                            >

                            <div class="form-text">
                                Students will not be able to apply after this date.
                            </div>

                        </div>


                        <!-- Submit -->

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg w-100"
                        >
                            Post Job
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
